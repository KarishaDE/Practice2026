name: .NET CI

on:
  push:
    branches: [ main, task01, task02, task03, task04, task05, task07, task08 ]
  pull_request:
    branches: [ main, task01, task02, task03, task04, task05, task07 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore practice2025.sln
    
    - name: Build
      run: dotnet build practice2025.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test practice2025.sln --configuration Release --no-build --verbosity normal
